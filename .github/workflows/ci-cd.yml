name: Validate and deploy previews

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e

  deploy-previews:
    name: Deploy Garden and Geometry previews
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: first-step-montessori-preview-workers
      cancel-in-progress: false
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out merged main revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Deploy both themes sequentially
        run: npm run deploy:previews

      - name: Verify public preview endpoints
        run: |
          curl --fail --silent --show-error --retry 4 \
            https://first-step-montessori-garden-preview.harshu-1982.workers.dev/ \
            > /dev/null
          curl --fail --silent --show-error --retry 4 \
            https://first-step-montessori-geometry-preview.harshu-1982.workers.dev/ \
            > /dev/null

name: Validate static website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Verify Garden static output
        run: npm run build:garden && npm run validate:static

      - name: Verify Geometry static output
        run: npm run build:geometry && npm run validate:static

      - name: Verify Garden production SEO output
        run: npm run validate:seo:garden

      - name: Verify Geometry production SEO output
        run: npm run validate:seo:geometry
